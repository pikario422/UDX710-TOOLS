name: Build UDX710 Tools

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build aarch64 deployment package
    runs-on: ubuntu-22.04
    env:
      TARGET_TRIPLE: aarch64-linux-gnu
      TARGET_GLIBC: '2.27'
      ZIG_VERSION: 0.13.0

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Install ABI-pinned cross toolchain
        run: |
          curl -fsSLO "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz"
          tar -xf "zig-linux-x86_64-${ZIG_VERSION}.tar.xz"
          mv "zig-linux-x86_64-${ZIG_VERSION}" .zig
          echo "$GITHUB_WORKSPACE/.zig" >> "$GITHUB_PATH"

      - name: Build backend for glibc 2.27
        run: |
          target="${TARGET_TRIPLE}.${TARGET_GLIBC}"
          make -C src clean
          make -C src CC="zig cc -target ${target}" STRIP=:
          file src/build/ofono-server
          readelf -h src/build/ofono-server | grep -q 'Machine:.*AArch64'
          ! readelf --version-info src/build/ofono-server | grep -Eq 'GLIBC_2\.(2[89]|[3-9][0-9])'

      - name: Build SMTP curl for glibc 2.27
        run: |
          target="${TARGET_TRIPLE}.${TARGET_GLIBC}"
          export CC="zig cc -target ${target}"
          export AR="zig ar"
          export RANLIB="zig ranlib"
          curl -fsSLO https://www.openssl.org/source/old/1.1.1/openssl-1.1.1w.tar.gz
          tar -xzf openssl-1.1.1w.tar.gz
          cd openssl-1.1.1w
          ./Configure linux-aarch64 no-shared no-tests --prefix="$GITHUB_WORKSPACE/.ci/curl-deps"
          make -j2 build_libs
          make install_sw
          cd "$GITHUB_WORKSPACE"
          curl -fsSLO https://curl.se/download/curl-7.88.1.tar.xz
          tar -xf curl-7.88.1.tar.xz
          cd curl-7.88.1
          ./configure \
            --host="$TARGET_TRIPLE" \
            --prefix="$GITHUB_WORKSPACE/.ci/curl-install" \
            --with-openssl="$GITHUB_WORKSPACE/.ci/curl-deps" \
            --disable-shared \
            --enable-static \
            --without-zlib \
            --without-libpsl \
            --without-nghttp2 \
            --without-brotli \
            --without-zstd \
            --without-libidn2 \
            --disable-ldap \
            --disable-ldaps \
            --disable-rtsp \
            --disable-dict \
            --disable-telnet \
            --disable-tftp \
            --disable-pop3 \
            --disable-imap \
            --disable-smb \
            --disable-gopher \
            --disable-mqtt \
            CPPFLAGS="-I$GITHUB_WORKSPACE/.ci/curl-deps/include" \
            LDFLAGS="-L$GITHUB_WORKSPACE/.ci/curl-deps/lib" \
            LIBS="-ldl -lpthread"
          make -j2
          make install
          install -Dm755 "$GITHUB_WORKSPACE/.ci/curl-install/bin/curl" "$GITHUB_WORKSPACE/.ci/curl"
          file "$GITHUB_WORKSPACE/.ci/curl"
          readelf -h "$GITHUB_WORKSPACE/.ci/curl" | grep -q 'Machine:.*AArch64'
          ! readelf --version-info "$GITHUB_WORKSPACE/.ci/curl" | grep -Eq 'GLIBC_2\.(2[89]|[3-9][0-9])'

      - name: Assemble deployment package
        env:
          BUILD_ID: ${{ github.sha }}
        run: |
          package_dir="release/6677"
          mkdir -p "$package_dir"
          install -m 0755 src/build/ofono-server "$package_dir/server"
          install -m 0755 .ci/curl "$package_dir/curl"
          cp -a web/dist "$package_dir/dist"
          cat > "$package_dir/start.sh" <<'EOF'
          #!/bin/sh
          set -eu
          cd /home/root/6677
          export PATH="/home/root/6677:$PATH"
          exec ./server "${PORT:-6677}"
          EOF
          chmod 0755 "$package_dir/start.sh"
          tar -C release -czf "UDX710-TOOLS-${BUILD_ID}.tar.gz" 6677
          sha256sum "UDX710-TOOLS-${BUILD_ID}.tar.gz" > "UDX710-TOOLS-${BUILD_ID}.tar.gz.sha256"

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: UDX710-TOOLS-${{ github.sha }}
          path: |
            UDX710-TOOLS-${{ github.sha }}.tar.gz
            UDX710-TOOLS-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
