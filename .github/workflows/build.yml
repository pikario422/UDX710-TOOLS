name: Build UDX710 Tools

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build aarch64 deployment package
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install aarch64 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu file

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build backend
        working-directory: src
        run: |
          make clean
          make
          file build/ofono-server
          aarch64-linux-gnu-readelf -h build/ofono-server | grep -q 'Machine:.*AArch64'

      - name: Assemble deployment package
        env:
          BUILD_ID: ${{ github.sha }}
        run: |
          package_dir="release/6677"
          mkdir -p "$package_dir"
          install -m 0755 src/build/ofono-server "$package_dir/server"
          cp -a web/dist "$package_dir/dist"
          cat > "$package_dir/start.sh" <<'EOF'
          #!/bin/sh
          set -eu
          cd /home/root/6677
          exec ./server "${PORT:-6677}"
          EOF
          chmod 0755 "$package_dir/start.sh"
          tar -C release -czf "UDX710-TOOLS-${BUILD_ID}.tar.gz" 6677
          sha256sum "UDX710-TOOLS-${BUILD_ID}.tar.gz" > "UDX710-TOOLS-${BUILD_ID}.tar.gz.sha256"

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: UDX710-TOOLS-${{ github.sha }}
          path: |
            UDX710-TOOLS-${{ github.sha }}.tar.gz
            UDX710-TOOLS-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
